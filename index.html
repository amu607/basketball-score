<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>籃球計分板</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin: 12px 0 20px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 260px 1fr;
      gap: 16px;
      align-items: stretch;
    }

    .team, .center-panel, .control-panel {
      background: #1f2937;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 12px rgba(0,0,0,.35);
    }

    .team-name {
      width: 100%;
      font-size: 28px;
      text-align: center;
      background: #374151;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 16px;
    }

    .score {
      font-size: 110px;
      font-weight: bold;
      text-align: center;
      color: #facc15;
      line-height: 1;
      margin-bottom: 16px;
    }

    .clock {
      font-size: 64px;
      font-weight: bold;
      text-align: center;
      color: #38bdf8;
      margin: 10px 0;
    }

    .shot-clock {
      font-size: 80px;
      font-weight: bold;
      text-align: center;
      color: #fb7185;
      margin: 10px 0;
    }

    .period {
      text-align: center;
      font-size: 28px;
      margin: 8px 0;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 8px 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #374151;
      color: white;
    }

    button:hover {
      background: #4b5563;
    }

    .primary {
      background: #2563eb;
    }

    .danger {
      background: #dc2626;
    }

    .warning {
      background: #ca8a04;
    }

    .success {
      background: #16a34a;
    }

    .small-info {
      font-size: 22px;
      text-align: center;
      margin-top: 12px;
    }

    .control-panel {
      margin-top: 16px;
    }

    .control-title {
      font-size: 22px;
      text-align: center;
      margin-bottom: 8px;
      color: #d1d5db;
    }

    @media (max-width: 900px) {
      .scoreboard {
        grid-template-columns: 1fr;
      }

      .score {
        font-size: 86px;
      }

      .clock {
        font-size: 54px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>籃球計分板</h1>

    <div class="scoreboard">
      <div class="team">
        <input id="teamAName" class="team-name" value="HOME" onchange="save()" />
        <div id="scoreA" class="score">0</div>

        <div class="row">
          <button onclick="addScore('A', 1)">+1</button>
          <button onclick="addScore('A', 2)">+2</button>
          <button onclick="addScore('A', 3)">+3</button>
          <button onclick="addScore('A', -1)">-1</button>
        </div>

        <div class="small-info">犯規：<span id="foulA">0</span></div>
        <div class="row">
          <button onclick="addFoul('A', 1)">犯規 +1</button>
          <button onclick="addFoul('A', -1)">犯規 -1</button>
        </div>

        <div class="small-info">暫停：<span id="timeoutA">0</span></div>
        <div class="row">
          <button onclick="addTimeout('A', 1)">暫停 +1</button>
          <button onclick="addTimeout('A', -1)">暫停 -1</button>
        </div>
      </div>

      <div class="center-panel">
        <div class="period">第 <span id="period">1</span> 節</div>

        <div id="gameClock" class="clock">10:00</div>
        <div class="row">
          <button class="primary" onclick="toggleGameClock()">開始 / 暫停</button>
          <button onclick="resetGameClock()">重設</button>
        </div>

        <div id="shotClock" class="shot-clock">24</div>
        <div class="row">
          <button class="warning" onclick="resetShotClock(24)">24秒</button>
          <button class="warning" onclick="resetShotClock(14)">14秒</button>
        </div>

        <div class="row">
          <button onclick="prevPeriod()">上一節</button>
          <button onclick="nextPeriod()">下一節</button>
        </div>
      </div>

      <div class="team">
        <input id="teamBName" class="team-name" value="AWAY" onchange="save()" />
        <div id="scoreB" class="score">0</div>

        <div class="row">
          <button onclick="addScore('B', 1)">+1</button>
          <button onclick="addScore('B', 2)">+2</button>
          <button onclick="addScore('B', 3)">+3</button>
          <button onclick="addScore('B', -1)">-1</button>
        </div>

        <div class="small-info">犯規：<span id="foulB">0</span></div>
        <div class="row">
          <button onclick="addFoul('B', 1)">犯規 +1</button>
          <button onclick="addFoul('B', -1)">犯規 -1</button>
        </div>

        <div class="small-info">暫停：<span id="timeoutB">0</span></div>
        <div class="row">
          <button onclick="addTimeout('B', 1)">暫停 +1</button>
          <button onclick="addTimeout('B', -1)">暫停 -1</button>
        </div>
      </div>
    </div>

    <div class="control-panel">
      <div class="control-title">控制區</div>
      <div class="row">
        <button class="success" onclick="fullscreen()">全螢幕</button>
        <button onclick="swapTeams()">交換隊伍</button>
        <button class="danger" onclick="resetAll()">重置比賽</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "basketball-scoreboard";

    let state = {
      teamAName: "HOME",
      teamBName: "AWAY",
      scoreA: 0,
      scoreB: 0,
      foulA: 0,
      foulB: 0,
      timeoutA: 0,
      timeoutB: 0,
      period: 1,
      gameSeconds: 600,
      shotSeconds: 24
    };

    let gameTimer = null;
    let shotTimer = null;

    function load() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        state = JSON.parse(saved);
      }
      render();
    }

    function save() {
      state.teamAName = document.getElementById("teamAName").value;
      state.teamBName = document.getElementById("teamBName").value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function render() {
      document.getElementById("teamAName").value = state.teamAName;
      document.getElementById("teamBName").value = state.teamBName;
      document.getElementById("scoreA").innerText = state.scoreA;
      document.getElementById("scoreB").innerText = state.scoreB;
      document.getElementById("foulA").innerText = state.foulA;
      document.getElementById("foulB").innerText = state.foulB;
      document.getElementById("timeoutA").innerText = state.timeoutA;
      document.getElementById("timeoutB").innerText = state.timeoutB;
      document.getElementById("period").innerText = state.period;
      document.getElementById("gameClock").innerText = formatTime(state.gameSeconds);
      document.getElementById("shotClock").innerText = state.shotSeconds;
      save();
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${s.toString().padStart(2, "0")}`;
    }

    function addScore(team, points) {
      if (team === "A") {
        state.scoreA = Math.max(0, state.scoreA + points);
      } else {
        state.scoreB = Math.max(0, state.scoreB + points);
      }
      render();
    }

    function addFoul(team, value) {
      if (team === "A") {
        state.foulA = Math.max(0, state.foulA + value);
      } else {
        state.foulB = Math.max(0, state.foulB + value);
      }
      render();
    }

    function addTimeout(team, value) {
      if (team === "A") {
        state.timeoutA = Math.max(0, state.timeoutA + value);
      } else {
        state.timeoutB = Math.max(0, state.timeoutB + value);
      }
      render();
    }

    function toggleGameClock() {
      if (gameTimer) {
        clearInterval(gameTimer);
        clearInterval(shotTimer);
        gameTimer = null;
        shotTimer = null;
        return;
      }

      gameTimer = setInterval(() => {
        if (state.gameSeconds > 0) {
          state.gameSeconds--;
          render();
        } else {
          clearInterval(gameTimer);
          gameTimer = null;
        }
      }, 1000);

      shotTimer = setInterval(() => {
        if (state.shotSeconds > 0) {
          state.shotSeconds--;
          render();
        } else {
          clearInterval(shotTimer);
          shotTimer = null;
        }
      }, 1000);
    }

    function resetGameClock() {
      state.gameSeconds = 600;
      render();
    }

    function resetShotClock(seconds) {
      state.shotSeconds = seconds;
      render();
    }

    function nextPeriod() {
      state.period++;
      state.gameSeconds = 600;
      state.shotSeconds = 24;
      state.foulA = 0;
      state.foulB = 0;
      render();
    }

    function prevPeriod() {
      state.period = Math.max(1, state.period - 1);
      render();
    }

    function swapTeams() {
      [
        state.teamAName,
        state.teamBName,
        state.scoreA,
        state.scoreB,
        state.foulA,
        state.foulB,
        state.timeoutA,
        state.timeoutB
      ] = [
        state.teamBName,
        state.teamAName,
        state.scoreB,
        state.scoreA,
        state.foulB,
        state.foulA,
        state.timeoutB,
        state.timeoutA
      ];

      render();
    }

    function resetAll() {
      if (!confirm("確定要重置整場比賽嗎？")) return;

      state = {
        teamAName: "HOME",
        teamBName: "AWAY",
        scoreA: 0,
        scoreB: 0,
        foulA: 0,
        foulB: 0,
        timeoutA: 0,
        timeoutB: 0,
        period: 1,
        gameSeconds: 600,
        shotSeconds: 24
      };

      clearInterval(gameTimer);
      clearInterval(shotTimer);
      gameTimer = null;
      shotTimer = null;

      render();
    }

    function fullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    load();
  </script>
</body>
</html>
