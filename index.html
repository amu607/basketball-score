<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>籃球計分板</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --score-scale: 1;
      --clock-scale: 1;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #020617;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 1800px;
      margin: auto;
      padding: 12px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .team,
    .center-panel,
    .control-panel {
      background: #111827;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.45);
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .team-name {
      width: 100%;
      font-size: clamp(34px, 5vw, 76px);
      text-align: center;
      background: #1f2937;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px;
      font-weight: bold;
    }

    .team-name:focus {
      outline: 3px solid #38bdf8;
    }

    .score {
      font-size: calc(clamp(150px, 18vw, 320px) * var(--score-scale));
      font-weight: 900;
      text-align: center;
      color: #facc15;
      line-height: 0.95;
      margin: 20px 0;
    }

    .period {
      text-align: center;
      font-size: clamp(56px, 7vw, 110px);
      font-weight: 900;
      color: #e5e7eb;
    }

    .clock {
      font-size: calc(clamp(110px, 13vw, 230px) * var(--clock-scale));
      font-weight: 900;
      text-align: center;
      color: #38bdf8;
      line-height: 1;
      margin: 24px 0;
    }

    .shot-clock {
      font-size: clamp(70px, 8vw, 130px);
      font-weight: 900;
      text-align: center;
      color: #fb7185;
      line-height: 1;
      margin: 12px 0;
    }

    .small-info {
      font-size: 30px;
      text-align: center;
      margin-top: 14px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 8px 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #374151;
      color: white;
      touch-action: manipulation;
    }

    button:hover {
      background: #4b5563;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      background: #2563eb;
    }

    .danger {
      background: #dc2626;
    }

    .warning {
      background: #ca8a04;
    }

    .success {
      background: #16a34a;
    }

    .control-panel {
      margin-top: 12px;
    }

    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .toggle-area {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .toggle-area label {
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    input[type="number"] {
      width: 64px;
      font-size: 18px;
      padding: 6px;
      border-radius: 8px;
      border: none;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    body.display-mode .score-buttons,
    body.display-mode .foul-buttons,
    body.display-mode .timeout-buttons,
    body.display-mode .clock-buttons,
    body.display-mode .period-buttons,
    body.display-mode .shot-buttons {
      display: none !important;
    }

    body.display-mode .container {
      max-width: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.display-mode .scoreboard {
      flex: 1;
    }

    body.display-mode .team,
    body.display-mode .center-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    body.display-mode .control-panel {
      background: rgba(17, 24, 39, 0.75);
      padding: 8px;
    }

    body.display-mode .score {
      font-size: calc(clamp(180px, 21vw, 380px) * var(--score-scale));
    }

    body.display-mode .clock {
      font-size: calc(clamp(130px, 15vw, 260px) * var(--clock-scale));
    }

    body.display-mode .team-name {
      background: transparent;
      border: none;
    }

    /* 直放時才把三欄堆疊成單欄 */
    @media (max-width: 900px) and (orientation: portrait) {
      .scoreboard {
        grid-template-columns: 1fr;
      }

      .control-bar {
        justify-content: center;
      }

      .toggle-area {
        justify-content: center;
      }
    }

    /* 手機橫放（矮螢幕）：維持三欄板型，改用螢幕高度縮放字體以塞進一個畫面 */
    @media (orientation: landscape) and (max-height: 600px) {
      .container {
        padding: 6px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .scoreboard {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        flex: 1;
        min-height: 0;
      }

      .team,
      .center-panel,
      .control-panel {
        padding: 8px;
        border-radius: 12px;
      }

      .team,
      .center-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .team-name {
        font-size: clamp(18px, 5vh, 40px);
        padding: 4px;
      }

      .score {
        font-size: calc(clamp(80px, 36vh, 220px) * var(--score-scale));
        margin: 6px 0;
      }

      .period {
        font-size: clamp(22px, 9vh, 60px);
      }

      .clock {
        font-size: calc(clamp(64px, 30vh, 190px) * var(--clock-scale));
        margin: 6px 0;
      }

      .shot-clock {
        font-size: clamp(34px, 14vh, 80px);
        margin: 4px 0;
      }

      .small-info {
        font-size: clamp(14px, 4vh, 26px);
        margin-top: 6px;
      }

      .row {
        gap: 6px;
        margin: 4px 0;
      }

      button {
        padding: 6px 10px;
        font-size: clamp(12px, 3.4vh, 17px);
      }

      .control-panel {
        margin-top: 6px;
        padding: 6px;
      }

      .control-bar {
        justify-content: center;
        gap: 8px;
      }

      .toggle-area {
        justify-content: center;
        gap: 10px;
      }

      .toggle-area label {
        font-size: clamp(12px, 3vh, 16px);
      }

      /* 主畫面模式下也維持橫放縮放，避免溢出 */
      body.display-mode .score {
        font-size: calc(clamp(90px, 40vh, 260px) * var(--score-scale));
      }

      body.display-mode .clock {
        font-size: calc(clamp(72px, 34vh, 220px) * var(--clock-scale));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scoreboard">
      <div class="team">
        <input id="teamAName" class="team-name" value="HOME" oninput="save()" />
        <div id="scoreA" class="score">0</div>

        <div class="row score-buttons">
          <button onclick="addScore('A', 1)">+1</button>
          <button onclick="addScore('A', 2)">+2</button>
          <button onclick="addScore('A', 3)">+3</button>
          <button onclick="addScore('A', -1)">-1</button>
        </div>

        <div id="foulPanelA">
          <div class="small-info">犯規：<span id="foulA">0</span></div>
          <div class="row foul-buttons">
            <button onclick="addFoul('A', 1)">+1</button>
            <button onclick="addFoul('A', -1)">-1</button>
          </div>
        </div>

        <div id="timeoutPanelA">
          <div class="small-info">暫停：<span id="timeoutA">0</span></div>
          <div class="row timeout-buttons">
            <button onclick="addTimeout('A', 1)">+1</button>
            <button onclick="addTimeout('A', -1)">-1</button>
          </div>
        </div>
      </div>

      <div class="center-panel">
        <div class="period">
          第 <span id="period">1</span> 節
        </div>

        <div id="gameClock" class="clock">20:00</div>

        <div class="row clock-buttons">
          <button class="primary" onclick="toggleGameClock()">開始 / 暫停</button>
          <button onclick="resetGameClock()">重設時間</button>
        </div>

        <div id="shotClockPanel">
          <div id="shotClock" class="shot-clock">24</div>
          <div class="row shot-buttons">
            <button class="warning" onclick="resetShotClock(24)">24秒</button>
            <button class="warning" onclick="resetShotClock(14)">14秒</button>
          </div>
        </div>

        <div class="row period-buttons">
          <button onclick="prevPeriod()">上一節</button>
          <button onclick="nextPeriod()">下一節</button>
        </div>
      </div>

      <div class="team">
        <input id="teamBName" class="team-name" value="AWAY" oninput="save()" />
        <div id="scoreB" class="score">0</div>

        <div class="row score-buttons">
          <button onclick="addScore('B', 1)">+1</button>
          <button onclick="addScore('B', 2)">+2</button>
          <button onclick="addScore('B', 3)">+3</button>
          <button onclick="addScore('B', -1)">-1</button>
        </div>

        <div id="foulPanelB">
          <div class="small-info">犯規：<span id="foulB">0</span></div>
          <div class="row foul-buttons">
            <button onclick="addFoul('B', 1)">+1</button>
            <button onclick="addFoul('B', -1)">-1</button>
          </div>
        </div>

        <div id="timeoutPanelB">
          <div class="small-info">暫停：<span id="timeoutB">0</span></div>
          <div class="row timeout-buttons">
            <button onclick="addTimeout('B', 1)">+1</button>
            <button onclick="addTimeout('B', -1)">-1</button>
          </div>
        </div>
      </div>
    </div>

    <div class="control-panel">
      <div class="row" style="justify-content: flex-end; margin: 0 0 8px;">
        <button class="primary" onclick="toggleControls()" id="controlsButton">隱藏功能鈕</button>
      </div>

      <div class="control-bar" id="controlBar">
        <div class="row">
          <button class="primary" onclick="toggleDisplayMode()" id="modeButton">主畫面模式</button>
          <button class="success" onclick="fullscreen()">全螢幕</button>
          <button onclick="swapTeams()">交換隊伍</button>
          <button class="danger" onclick="resetAll()">重置比賽</button>
        </div>

        <div class="row">
          <button onclick="adjustFontScale('score', -0.1)">得分字 −</button>
          <button onclick="adjustFontScale('score', 0.1)">得分字 ＋</button>
          <button onclick="adjustFontScale('clock', -0.1)">時間字 −</button>
          <button onclick="adjustFontScale('clock', 0.1)">時間字 ＋</button>
          <button onclick="resetFontScale()">字型重設</button>
        </div>

        <div class="toggle-area">
          <label>
            <input type="checkbox" id="showFouls" onchange="togglePanels(); save();" />
            犯規
          </label>

          <label>
            <input type="checkbox" id="showTimeouts" onchange="togglePanels(); save();" />
            暫停
          </label>

          <label>
            <input type="checkbox" id="showShotClock" onchange="togglePanels(); save();" />
            24秒
          </label>

          <label>
            每節
            <input type="number" id="periodMinutes" min="1" value="20" onchange="applySettings()" />
            分
          </label>

          <label>
            節數
            <input type="number" id="totalPeriods" min="1" value="2" onchange="applySettings()" />
          </label>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "basketball-scoreboard-v5";

    let state = {
      teamAName: "HOME",
      teamBName: "AWAY",
      scoreA: 0,
      scoreB: 0,
      foulA: 0,
      foulB: 0,
      timeoutA: 0,
      timeoutB: 0,
      period: 1,
      totalPeriods: 2,
      periodMinutes: 20,
      gameSeconds: 1200,
      shotSeconds: 24,
      showFouls: false,
      showTimeouts: false,
      showShotClock: false,
      displayMode: false,
      scoreScale: 1,
      clockScale: 1,
      showControls: true
    };

    let gameTimer = null;
    let shotTimer = null;

    function load() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = { ...state, ...JSON.parse(saved) };
        } catch (error) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      render();
    }

    function save() {
      state.teamAName = document.getElementById("teamAName").value;
      state.teamBName = document.getElementById("teamBName").value;
      state.showFouls = document.getElementById("showFouls").checked;
      state.showTimeouts = document.getElementById("showTimeouts").checked;
      state.showShotClock = document.getElementById("showShotClock").checked;
      state.periodMinutes = Math.max(1, Number(document.getElementById("periodMinutes").value || 20));
      state.totalPeriods = Math.max(1, Number(document.getElementById("totalPeriods").value || 2));

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function render() {
      document.getElementById("teamAName").value = state.teamAName;
      document.getElementById("teamBName").value = state.teamBName;

      document.getElementById("scoreA").innerText = state.scoreA;
      document.getElementById("scoreB").innerText = state.scoreB;

      document.getElementById("foulA").innerText = state.foulA;
      document.getElementById("foulB").innerText = state.foulB;

      document.getElementById("timeoutA").innerText = state.timeoutA;
      document.getElementById("timeoutB").innerText = state.timeoutB;

      document.getElementById("period").innerText = state.period;
      document.getElementById("gameClock").innerText = formatTime(state.gameSeconds);
      document.getElementById("shotClock").innerText = state.shotSeconds;

      document.getElementById("showFouls").checked = state.showFouls;
      document.getElementById("showTimeouts").checked = state.showTimeouts;
      document.getElementById("showShotClock").checked = state.showShotClock;

      document.getElementById("periodMinutes").value = state.periodMinutes;
      document.getElementById("totalPeriods").value = state.totalPeriods;

      document.documentElement.style.setProperty("--score-scale", state.scoreScale);
      document.documentElement.style.setProperty("--clock-scale", state.clockScale);

      document.getElementById("controlBar").classList.toggle("hidden", !state.showControls);
      document.getElementById("controlsButton").innerText = state.showControls ? "隱藏功能鈕" : "顯示功能鈕";

      document.body.classList.toggle("display-mode", state.displayMode);
      document.getElementById("modeButton").innerText = state.displayMode ? "控制台模式" : "主畫面模式";

      togglePanels();
      save();
    }

    function adjustFontScale(target, delta) {
      const key = target === "clock" ? "clockScale" : "scoreScale";
      const next = Math.round((state[key] + delta) * 10) / 10;
      state[key] = Math.min(3, Math.max(0.3, next));
      render();
    }

    function resetFontScale() {
      state.scoreScale = 1;
      state.clockScale = 1;
      render();
    }

    function toggleDisplayMode() {
      state.displayMode = !state.displayMode;
      render();
    }

    function togglePanels() {
      const showFouls = document.getElementById("showFouls").checked;
      const showTimeouts = document.getElementById("showTimeouts").checked;
      const showShotClock = document.getElementById("showShotClock").checked;

      document.getElementById("foulPanelA").classList.toggle("hidden", !showFouls);
      document.getElementById("foulPanelB").classList.toggle("hidden", !showFouls);

      document.getElementById("timeoutPanelA").classList.toggle("hidden", !showTimeouts);
      document.getElementById("timeoutPanelB").classList.toggle("hidden", !showTimeouts);

      document.getElementById("shotClockPanel").classList.toggle("hidden", !showShotClock);
    }

    function applySettings() {
      const nextPeriodMinutes = Math.max(1, Number(document.getElementById("periodMinutes").value || 20));
      const nextTotalPeriods = Math.max(1, Number(document.getElementById("totalPeriods").value || 2));

      state.periodMinutes = nextPeriodMinutes;
      state.totalPeriods = nextTotalPeriods;
      state.gameSeconds = state.periodMinutes * 60;

      if (state.period > state.totalPeriods) {
        state.period = state.totalPeriods;
      }

      render();
    }

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Number(seconds || 0));
      const m = Math.floor(safeSeconds / 60);
      const s = safeSeconds % 60;
      return `${m}:${s.toString().padStart(2, "0")}`;
    }

    function addScore(team, points) {
      if (team === "A") {
        state.scoreA = Math.max(0, state.scoreA + points);
      } else {
        state.scoreB = Math.max(0, state.scoreB + points);
      }

      render();
    }

    function addFoul(team, value) {
      if (team === "A") {
        state.foulA = Math.max(0, state.foulA + value);
      } else {
        state.foulB = Math.max(0, state.foulB + value);
      }

      render();
    }

    function addTimeout(team, value) {
      if (team === "A") {
        state.timeoutA = Math.max(0, state.timeoutA + value);
      } else {
        state.timeoutB = Math.max(0, state.timeoutB + value);
      }

      render();
    }

    function toggleGameClock() {
      if (gameTimer) {
        stopTimers();
        return;
      }

      gameTimer = setInterval(() => {
        if (state.gameSeconds > 0) {
          state.gameSeconds--;
          render();
        } else {
          clearInterval(gameTimer);
          gameTimer = null;
        }
      }, 1000);

      if (state.showShotClock) {
        shotTimer = setInterval(() => {
          if (state.shotSeconds > 0) {
            state.shotSeconds--;
            render();
          } else {
            clearInterval(shotTimer);
            shotTimer = null;
          }
        }, 1000);
      }
    }

    function stopTimers() {
      clearInterval(gameTimer);
      clearInterval(shotTimer);
      gameTimer = null;
      shotTimer = null;
    }

    function resetGameClock() {
      state.gameSeconds = state.periodMinutes * 60;
      render();
    }

    function resetShotClock(seconds) {
      state.shotSeconds = seconds;
      render();
    }

    function nextPeriod() {
      state.period++;
      state.gameSeconds = state.periodMinutes * 60;
      state.shotSeconds = 24;
      state.foulA = 0;
      state.foulB = 0;
      render();
    }

    function prevPeriod() {
      state.period = Math.max(1, state.period - 1);
      render();
    }

    function swapTeams() {
      [
        state.teamAName,
        state.teamBName,
        state.scoreA,
        state.scoreB,
        state.foulA,
        state.foulB,
        state.timeoutA,
        state.timeoutB
      ] = [
        state.teamBName,
        state.teamAName,
        state.scoreB,
        state.scoreA,
        state.foulB,
        state.foulA,
        state.timeoutB,
        state.timeoutA
      ];

      render();
    }

    function resetAll() {
      if (!confirm("確定要重置整場比賽嗎？")) return;

      stopTimers();

      state = {
        teamAName: "HOME",
        teamBName: "AWAY",
        scoreA: 0,
        scoreB: 0,
        foulA: 0,
        foulB: 0,
        timeoutA: 0,
        timeoutB: 0,
        period: 1,
        totalPeriods: 2,
        periodMinutes: 20,
        gameSeconds: 1200,
        shotSeconds: 24,
        showFouls: false,
        showTimeouts: false,
        showShotClock: false,
        displayMode: false
      };

      render();
    }

    function fullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    load();
  </script>
</body>
</html>
